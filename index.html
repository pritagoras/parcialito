<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parcialito: trivia para estudiar</title>
  <meta name="description" content="Practicá con preguntas de opción múltiple por materia y tema, con racha, puntos y sonidos.">
  <meta name="theme-color" content="#170F2E">
  <link rel="icon" type="image/png" sizes="512x512" href="ico.png">
  <link rel="apple-touch-icon" href="ico.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Parcialito">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=dev">
</head>
<body>
  <div id="app"></div>
  <canvas id="confeti" aria-hidden="true"></canvas>
  <div id="aviso" role="status" aria-live="polite"></div>


  <noscript>Necesitás activar JavaScript para usar Repaso.</noscript>
  <script type="module" src="js/app.js?v=20261026-2"></script>

<script id="red-de-seguridad">
(function () {
  var detalle = 'No se pudo cargar js/app.js o alguno de sus módulos.';
  function aviso() {
    var app = document.getElementById('app');
    if (!app || app.childElementCount) return;
    app.innerHTML = '<div style="padding:2rem 1rem;text-align:center;font-family:system-ui,sans-serif;color:#FFF3DC;overflow-wrap:anywhere">' +
      '<p style="margin:0 0 1rem">Parcialito no pudo iniciar. Detecté este problema:</p>' +
      '<pre style="white-space:pre-wrap;text-align:left;font-size:.85rem;background:#211e31;padding:12px;border-radius:10px">' +
      detalle.replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}) + '</pre>' +
      '<button id="act-ver" style="font:inherit;font-weight:700;padding:.8rem 1.4rem;border-radius:14px;border:0;background:#9B7BFF;color:#120a26">Volver a intentar</button></div>';
    document.getElementById('act-ver').onclick = function () {
      location.replace(location.pathname + '?actualizar=' + Date.now() + location.hash);
    };
  }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t.tagName && t.tagName !== 'SCRIPT') return;
    if (e && e.message) detalle = e.message + (e.filename ? '\\nArchivo: ' + e.filename : '') + (e.lineno ? '\\nLínea: ' + e.lineno : '');
    setTimeout(aviso, 300);
  }, true);
  window.addEventListener('unhandledrejection', function(e) {
    var r = e && e.reason;
    detalle = 'Error de módulo: ' + (r && r.message ? r.message : String(r || 'desconocido'));
    setTimeout(aviso, 300);
  });
  setTimeout(aviso, 6000);
})();
</script>
<!-- Diagnóstico de inicio: versión 2 -->
</body>
</html>
