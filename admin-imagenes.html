<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#170F2E"><title>Fotos · Parcialito</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/admin.css?v=20261114-envios2"><style>
.images-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 20px;flex-wrap:wrap}.images-head p{color:var(--muted);margin-top:5px}.images-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}.image-submission{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;min-width:0}.image-submission h2{font-size:16px;margin:10px 0 4px}.image-submission p{color:var(--muted);margin:5px 0;overflow-wrap:anywhere}.image-thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.image-thumbs a{display:block;overflow:hidden;border-radius:10px;background:var(--panel2);aspect-ratio:4/3}.image-thumbs img{width:100%;height:100%;object-fit:cover}.image-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.image-actions button,.image-actions a{font:inherit;text-decoration:none;border:0;border-radius:9px;padding:9px 11px;background:var(--panel2);color:var(--text);font-weight:700}.image-actions .review{background:#214b3d;color:#9bf0c8}.image-actions .delete{background:#51263a;color:#ffb4c7}.image-status{font-size:11px;padding:5px 8px;border-radius:20px;background:#493b24;color:#ffd58a}.image-status.done{background:#153c32;color:var(--green)}.admin-images-link{white-space:nowrap;text-decoration:none;background:#342650;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-weight:700}.image-empty{padding:36px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:15px}@media(max-width:600px){.images-head{align-items:flex-start}.image-actions>*{flex:1;text-align:center}}
