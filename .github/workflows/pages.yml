# Publica el sitio en GitHub Pages cada vez que hacés push a main.
# Antes valida las preguntas y regenera data/index.json automáticamente.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar preguntas y regenerar el índice
        run: python tools/actualizar_indice.py

      - name: Armar carpeta del sitio
        run: |
          mkdir _sitio
          cp -r index.html css js data _sitio/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
