name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Valida todos los temas y regenera data/index.json.
      # Si hay un error en algún JSON, el deploy se frena y no se rompe el sitio.
      - name: Validar temas y regenerar el índice
        run: python tools/actualizar_indice.py

      # Si existe ico.png en la raíz, se usa para regenerar ambos tamaños PWA.
      # Si todavía no se subió, se conservan los iconos predeterminados.
      - name: Generar iconos desde ico.png (si existe)
        run: |
          if [ -f ico.png ]; then
            python -m pip install --quiet --disable-pip-version-check pillow
            python tools/generar_iconos.py
          else
            echo "No se encontró ico.png; se conservan los iconos actuales."
          fi

      # Le pone un número de versión a los archivos para que ningún celular
      # use copias viejas guardadas (así nadie tiene que borrar datos).
      - name: Versionar archivos
        run: python tools/versionar.py "${GITHUB_SHA::8}"

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
