<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">Puente de hidrógeno entre moléculas de agua</title><desc id="d">Dos moléculas de agua. La línea punteada une un hidrógeno enlazado covalentemente al oxígeno de una molécula con el oxígeno de la otra.</desc><rect width="1100" height="560" rx="24" fill="#fbfaff"/><text x="550" y="68" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle" fill="#8b4f9f">Puente de hidrógeno</text><g stroke="#594477" stroke-width="9" stroke-linecap="round"><path d="M260 280L165 195M260 280L355 195"/><path d="M840 280L745 195M840 280L935 195"/></g><path d="M355 195L840 280" stroke="#9b7bff" stroke-width="7" stroke-dasharray="14 13" fill="none"/><g fill="#ffdfd8" stroke="#c66b61" stroke-width="5"><circle cx="260" cy="280" r="58"/><circle cx="840" cy="280" r="58"/></g><g fill="#dceaff" stroke="#5f86bd" stroke-width="5"><circle cx="165" cy="195" r="36"/><circle cx="355" cy="195" r="36"/><circle cx="745" cy="195" r="36"/><circle cx="935" cy="195" r="36"/></g><g font-family="Arial" font-size="25" font-weight="700" text-anchor="middle" fill="#302445"><text x="260" y="289">O</text><text x="840" y="289">O</text><text x="165" y="204">H</text><text x="355" y="204">H</text><text x="745" y="204">H</text><text x="935" y="204">H</text></g><text x="550" y="430" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#302445">Interacción intermolecular O···H—O</text><text x="550" y="480" text-anchor="middle" font-family="Arial" font-size="20" fill="#746783">La línea punteada representa la atracción entre moléculas distintas</text></svg>