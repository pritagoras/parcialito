<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Retroinhibición por producto final</title><desc id="d">Una vía con tres etapas enzimáticas. El producto final envía una señal inhibitoria dirigida a E1, la primera enzima.</desc><rect width="1200" height="620" rx="24" fill="#fbfaff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#594477"/></marker><marker id="inh" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M6 0V12" stroke="#c47b45" stroke-width="3"/></marker></defs><g fill="#eee8fb" stroke="#705b91" stroke-width="4"><rect x="35" y="270" width="160" height="90" rx="15"/><rect x="345" y="270" width="190" height="90" rx="15"/><rect x="655" y="270" width="190" height="90" rx="15"/><rect x="965" y="270" width="200" height="90" rx="15"/></g><g font-family="Arial" text-anchor="middle" fill="#302445"><text x="115" y="325" font-size="25" font-weight="700">Sustrato</text><text x="440" y="325" font-size="22" font-weight="700">Intermedio 1</text><text x="750" y="325" font-size="22" font-weight="700">Intermedio 2</text><text x="1065" y="325" font-size="22" font-weight="700">Producto final</text><text x="270" y="235" font-size="23" font-weight="700">E1</text><text x="595" y="235" font-size="23" font-weight="700">E2</text><text x="905" y="235" font-size="23" font-weight="700">E3</text></g><g stroke="#594477" stroke-width="5" fill="none" marker-end="url(#arr)"><path d="M195 315H335"/><path d="M535 315H645"/><path d="M845 315H955"/></g><path d="M1065 360V465H270V255" stroke="#c47b45" stroke-width="6" stroke-dasharray="12 9" fill="none" marker-end="url(#inh)"/><rect x="445" y="465" width="400" height="65" rx="14" fill="#f7eadf" stroke="#c47b45" stroke-width="3"/><text x="645" y="507" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#9e612f">El producto final inhibe E1</text><text x="600" 