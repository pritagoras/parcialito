<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Regulación de una vía metabólica</title><desc id="d">Una vía de tres reacciones convierte un sustrato en un producto final. Una señal de retorno del producto final alcanza la primera enzima.</desc><rect width="1200" height="620" rx="24" fill="#fbfaff"/><defs><marker id="arrf" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#594477"/></marker></defs><g fill="#eee8fb" stroke="#705b91" stroke-width="4"><rect x="35" y="270" width="160" height="90" rx="15"/><rect x="345" y="270" width="190" height="90" rx="15"/><rect x="655" y="270" width="190" height="90" rx="15"/><rect x="965" y="270" width="200" height="90" rx="15"/></g><g font-family="Arial" text-anchor="middle" fill="#302445"><text x="115" y="325" font-size="25" font-weight="700">Sustrato</text><text x="440" y="325" font-size="22" font-weight="700">Intermedio 1</text><text x="750" y="325" font-size="22" font-weight="700">Intermedio 2</text><text x="1065" y="325" font-size="22" font-weight="700">Producto final</text><text x="270" y="235" font-size="23" font-weight="700">E1</text><text x="595" y="235" font-size="23" font-weight="700">E2</text><text x="905" y="235" font-size="23" font-weight="700">E3</text></g><g stroke="#594477" stroke-width="5" fill="none" marker-end="url(#arrf)"><path d="M195 315H335"/><path d="M535 315H645"/><path d="M845 315H955"/></g><path d="M1065 360V465H270V250" stroke="#c47b45" stroke-width="6" stroke-dasharray="12 9" fill="none"/><path d="M250 250H290" stroke="#c47b45" stroke-width="9" stroke-linecap="round"/><text x="600" y="555" text-anchor="middle" font-family="Arial" font-size="19" fill="#746783"> </text></svg>