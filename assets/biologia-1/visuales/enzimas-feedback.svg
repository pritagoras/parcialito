<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">Retroinhibición por producto final en una vía metabólica</title><desc id="d">Una secuencia de sustrato a producto final mediante tres enzimas; el producto final inhibe alostéricamente la primera enzima.</desc><rect width="1100" height="600" rx="24" fill="#fbfaff"/><g fill="#eee8fb" stroke="#705b91" stroke-width="4"><rect x="60" y="230" width="170" height="90" rx="15"/><rect x="330" y="230" width="150" height="90" rx="15"/><rect x="590" y="230" width="150" height="90" rx="15"/><rect x="850" y="230" width="180" height="90" rx="15"/></g><g font-family="Arial" text-anchor="middle" fill="#302445"><text x="145" y="282" font-size="27" font-weight="700">Sustrato</text><text x="405" y="282" font-size="27" font-weight="700">Intermedio 1</text><text x="665" y="282" font-size="27" font-weight="700">Intermedio 2</text><text x="940" y="282" font-size="27" font-weight="700">Producto final</text><text x="275" y="205" font-size="22" font-weight="700">E1</text><text x="535" y="205" font-size="22" font-weight="700">E2</text><text x="795" y="205" font-size="22" font-weight="700">E3</text></g><g stroke="#594477" stroke-width="5" fill="none"><path d="M230 275H330M480 275H590M740 275H850"/></g><g stroke="#c47b45" stroke-width="7" fill="none"><path d="M940 320V455H145V325" stroke-dasharray="12 10"/><path d="M130 345L145 325L160 345"/></g><rect x="350" y="420" width="360" height="66" rx="14" fill="#f7eadf" stroke="#c47b45" stroke-width="3"/><text x="530" y="462" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#9e612f">Inhibición alostérica de E1</text><text x="550" y="545" text-anchor="middle" font-family="Arial" font-size="20" fill="#746783">El producto acumulado frena una etapa inicial de la vía</text></svg>