<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">Regulación de una vía metabólica</title><desc id="d">Una secuencia de tres reacciones desde el sustrato al producto final, con una señal de retorno que llega a la primera enzima.</desc><rect width="1100" height="600" rx="24" fill="#fbfaff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#594477"/></marker></defs><g fill="#eee8fb" stroke="#705b91" stroke-width="4"><rect x="35" y="245" width="180" height="86" rx="15"/><rect x="360" y="245" width="160" height="86" rx="15"/><rect x="640" y="245" width="160" height="86" rx="15"/><rect x="900" y="245" width="170" height="86" rx="15"/></g><g font-family="Arial" text-anchor="middle" fill="#302445"><text x="125" y="297" font-size="24" font-weight="700">Sustrato</text><text x="440" y="297" font-size="22" font-weight="700">Intermedio 1</text><text x="720" y="297" font-size="22" font-weight="700">Intermedio 2</text><text x="985" y="297" font-size="22" font-weight="700">Producto final</text><text x="287" y="210" font-size="23" font-weight="700">E1</text><text x="580" y="210" font-size="23" font-weight="700">E2</text><text x="850" y="210" font-size="23" font-weight="700">E3</text></g><g stroke="#594477" stroke-width="5" fill="none" marker-end="url(#arr)"><path d="M215 288H350"/><path d="M520 288H630"/><path d="M800 288H890"/></g><path d="M985 331V470H287V225" stroke="#c47b45" stroke-width="6" stroke-dasharray="12 10" fill="none"/><path d="M263 225H311" stroke="#c47b45" stroke-width="8" stroke-linecap="round"/><text x="620" y="525" text-anchor="middle" font-family="Arial" font-size="20" fill="#746783">El retorno regulador conecta el producto final con una etapa inicial</text></svg>