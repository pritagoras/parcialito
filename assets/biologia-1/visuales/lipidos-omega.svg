<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Numeración omega de un ácido graso</title><desc id="d">Cadena hidrocarbonada con un grupo carboxilo a la izquierda, un metilo terminal a la derecha y un primer doble enlace situado entre el tercer y cuarto carbono contados desde el extremo metilo.</desc><rect width="1000" height="440" rx="24" fill="#fbfaff"/><g stroke="#594477" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="none"><path d="M125 225L185 185L245 225L305 185L365 225L425 185L485 225L545 185L605 225L665 185L725 225L785 185L845 225"/><path d="M665 185L725 225" stroke="#9b7bff" stroke-width="7"/><path d="M665 174L725 214" stroke="#9b7bff" stroke-width="4"/></g><g font-family="Arial" fill="#302445" font-size="25" font-weight="700"><text x="45" y="235">HOOC</text><text x="855" y="235">CH₃</text></g><g font-family="Arial" fill="#8b4f9f" font-size="22" font-weight="700" text-anchor="middle"><text x="845" y="130">1</text><text x="785" y="280">2</text><text x="725" y="130">3</text><text x="665" y="280">4</text></g><path d="M845 145V175M785 255V210M725 145L725 210M665 255V205" stroke="#8b4f9f" stroke-width="2.5" stroke-dasharray="4 4"/><text x="700" y="360" text-anchor="middle" font-family="Arial" font-size="22" fill="#302445">Contá desde el extremo metilo (CH₃)</text><text x="500" y="405" text-anchor="middle" font-family="Arial" font-size="18" fill="#746783">El primer doble enlace determina la serie omega</text></svg>