<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Unión de una base nitrogenada a una pentosa</title><desc id="d">Una pentosa cíclica con carbonos numerados y una base nitrogenada conectada por un enlace que parte del carbono 1 prima.</desc><rect width="900" height="520" rx="24" fill="#fbfaff"/><path d="M350 155L495 195L470 340L330 365L265 230Z" fill="#eee8fb" stroke="#594477" stroke-width="6"/><text x="355" y="177" font-family="Arial" font-size="27" font-weight="700" fill="#302445">O</text><g font-family="Arial" font-size="25" fill="#302445" text-anchor="middle"><text x="495" y="188">1′</text><text x="482" y="365">2′</text><text x="330" y="400">3′</text><text x="245" y="230">4′</text><text x="470" y="205" font-size="18" font-weight="700">C</text></g><path d="M495 195L600 145" stroke="#9b7bff" stroke-width="8" fill="none"/><path d="M600 145L660 110L720 145L720 215L660 250L600 215Z" fill="#dceeff" stroke="#397fa6" stroke-width="6"/><text x="660" y="185" font-family="Arial" font-size="30" font-weight="700" fill="#302445" text-anchor="middle">N</text><text x="550" y="115" font-family="Arial" font-size="20" fill="#8b4f9f" font-weight="700">Enlace</text><text x="450" y="465" text-anchor="middle" font-family="Arial" font-size="21" fill="#746783">El carbono 1′ participa en la unión con la base nitrogenada</text></svg>