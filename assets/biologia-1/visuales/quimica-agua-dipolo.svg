<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Geometría polar de la molécula de agua</title><desc id="d">Un oxígeno parcialmente negativo unido covalentemente a dos hidrógenos parcialmente positivos en geometría angular.</desc><rect width="1000" height="520" rx="24" fill="#fbfaff"/><path d="M500 275L330 155M500 275L670 155" stroke="#594477" stroke-width="12" stroke-linecap="round"/><circle cx="500" cy="275" r="70" fill="#ffdfd8" stroke="#c66b61" stroke-width="5"/><circle cx="330" cy="155" r="46" fill="#dceaff" stroke="#5f86bd" stroke-width="5"/><circle cx="670" cy="155" r="46" fill="#dceaff" stroke="#5f86bd" stroke-width="5"/><g font-family="Arial" text-anchor="middle" fill="#302445"><text x="500" y="290" font-size="42" font-weight="700">O δ−</text><text x="330" y="168" font-size="31" font-weight="700">H δ+</text><text x="670" y="168" font-size="31" font-weight="700">H δ+</text><text x="500" y="420" font-size="29" font-weight="700">∠ H–O–H ≈ 104,5°</text><text x="500" y="470" font-size="21" fill="#746783">Los enlaces O–H son covalentes polares; la molécula es un dipolo</text></g></svg>