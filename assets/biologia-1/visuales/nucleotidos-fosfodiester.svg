<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Enlace fosfodiéster en una cadena de ácido nucleico</title><desc id="d">Dos pentosas sucesivas conectadas a través de un fosfato entre el oxígeno 3 prima de una y el carbono 5 prima de la siguiente.</desc><rect width="1200" height="540" rx="24" fill="#fbfaff"/><g fill="#eee8fb" stroke="#594477" stroke-width="6"><path d="M190 185L300 185L350 275L270 365L160 300Z"/><path d="M820 185L930 185L980 275L900 365L790 300Z"/></g><g stroke="#9b7bff" stroke-width="8" fill="none"><path d="M350 275L470 275L565 275"/><path d="M635 275L750 275L820 275"/></g><circle cx="600" cy="275" r="46" fill="#ded3ff" stroke="#705b91" stroke-width="5"/><g font-family="Arial" font-size="27" fill="#302445" text-anchor="middle"><text x="250" y="260" font-weight="700">Azúcar 1</text><text x="875" y="260" font-weight="700">Azúcar 2</text><text x="600" y="285" font-weight="700">P</text><text x="380" y="245" font-weight="700">3′</text><text x="760" y="245" font-weight="700">5′</text><text x="600" y="425" font-size="30" font-weight="700" fill="#8b4f9f">Enlace fosfodiéster 3′–5′</text></g><g stroke="#8b4f9f" stroke-width="4" fill="none"><path d="M390 390L475 315"/><path d="M815 390L725 315"/></g><text x="600" y="485" font-family="Arial" font-size="20" text-anchor="middle" fill="#746783">El fosfato enlaza dos azúcares en el esqueleto azúcar-fosfato</text></svg>