<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">Efectores alostéricos positivos y negativos</title><desc id="d">Tres curvas sigmoideas de velocidad frente a sustrato: un activador desplaza la curva a la izquierda, el control queda al centro y un inhibidor la desplaza a la derecha.</desc><rect width="1100" height="560" rx="24" fill="#fbfaff"/><g stroke="#594477" stroke-width="4" fill="none"><path d="M125 115V420H755"/><path d="M125 270H755" stroke-dasharray="5 10" opacity=".2"/></g><g font-family="Arial" fill="#302445" font-size="22"><text transform="translate(45 290) rotate(-90)" text-anchor="middle">v₀</text><text x="755" y="458" text-anchor="end">[S]</text><text x="125" y="452" text-anchor="middle">0</text></g><path d="M125 420 C180 415 215 345 245 255 S330 145 740 140" stroke="#2b8b71" stroke-width="8" fill="none"/><path d="M125 420 C260 420 310 395 350 300 S440 150 740 140" stroke="#9b7bff" stroke-width="8" fill="none"/><path d="M125 420 C345 420 405 410 465 345 S550 165 740 140" stroke="#c47b45" stroke-width="8" fill="none"/><rect x="800" y="145" width="250" height="220" rx="15" fill="#f0ebfa" stroke="#d8cbed" stroke-width="2"/><g font-family="Arial" font-size="20" fill="#302445"><path d="M825 190H875" stroke="#2b8b71" stroke-width="8" stroke-linecap="round"/><text x="890" y="197">Activador (+)</text><path d="M825 255H875" stroke="#9b7bff" stroke-width="8" stroke-linecap="round"/><text x="890" y="262">Control</text><path d="M825 320H875" stroke="#c47b45" stroke-width="8" stroke-linecap="round"/><text x="890" y="327">Inhibidor (−)</text></g><text x="925" y="410" text-anchor="middle" font-family="Arial" font-size="18" fill="#746783">Curvas esquemáticas</text></svg>