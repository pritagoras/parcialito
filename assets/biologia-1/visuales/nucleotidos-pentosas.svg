<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">Comparación de dos pentosas</title><desc id="d">Dos anillos de pentosa con los carbonos numerados. En A, el carbono 2′ tiene un grupo hidroxilo; en B tiene hidrógeno.</desc><rect width="1100" height="600" rx="24" fill="#fbfaff"/><g font-family="Arial" font-size="32" font-weight="700" fill="#302445" text-anchor="middle"><text x="270" y="70">A</text><text x="825" y="70">B</text></g><g stroke="#594477" stroke-width="6" fill="#eee8fb"><path d="M240 190L340 235L320 345L220 345L180 245Z"/><path d="M790 190L890 235L870 345L770 345L730 245Z"/></g><g font-family="Arial" font-size="24" fill="#302445" text-anchor="middle"><text x="240" y="205" font-weight="700">O</text><text x="340" y="225">1′</text><text x="340" y="360">2′</text><text x="220" y="380">3′</text><text x="165" y="245">4′</text><text x="790" y="205" font-weight="700">O</text><text x="890" y="225">1′</text><text x="890" y="360">2′</text><text x="770" y="380">3′</text><text x="715" y="245">4′</text></g><g stroke="#9b7bff" stroke-width="5" fill="none"><path d="M320 345L385 405"/><path d="M870 345L935 405"/></g><g font-family="Arial" font-size="27" font-weight="700" fill="#8b4f9f"><text x="395" y="420">OH</text><text x="945" y="420">H</text></g><g stroke="#594477" stroke-width="4" fill="none"><path d="M180 245L135 210"/><path d="M730 245L685 210"/></g><g font-family="Arial" font-size="22" fill="#746783" text-anchor="middle"><text x="270" y="500"> </text><text x="825" y="500"> </text><text x="550" y="550">La sustitución en el carbono 2′ es la diferencia entre ambas pentosas</text></g></svg>