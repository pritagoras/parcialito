<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Sitio activo y sitio alostérico de una enzima</title><desc id="d">Esquema de una enzima con un sitio activo que recibe al sustrato y un sitio alostérico separado que recibe un efector regulador.</desc><rect width="1100" height="620" rx="24" fill="#fbfaff"/><path d="M300 190C335 95 490 95 555 160C640 115 780 150 810 250C865 360 780 465 660 455C570 525 390 485 340 405C250 370 240 265 300 190Z" fill="#eee8fb" stroke="#705b91" stroke-width="7"/><path d="M455 170C490 120 555 120 590 170L565 220L480 220Z" fill="#fbfaff" stroke="#9b7bff" stroke-width="6"/><path d="M760 330C820 310 850 350 830 405L780 420L740 380Z" fill="#fbfaff" stroke="#c47b45" stroke-width="6"/><path d="M520 105L520 145" stroke="#397fa6" stroke-width="6" fill="none"/><path d="M500 125L520 145L540 125" stroke="#397fa6" stroke-width="6" fill="none"/><path d="M900 365L845 365" stroke="#c47b45" stroke-width="6" fill="none"/><path d="M865 345L845 365L865 385" stroke="#c47b45" stroke-width="6" fill="none"/><path d="M455 66L520 66L555 100L520 135L455 135L425 100Z" fill="#dceeff" stroke="#397fa6" stroke-width="5"/><circle cx="950" cy="365" r="42" fill="#f7eadf" stroke="#c47b45" stroke-width="5"/><g font-family="Arial" font-size="24" fill="#302445"><text x="520" y="100" text-anchor="middle" font-weight="700">Sustrato</text><text x="950" y="373" text-anchor="middle" font-weight="700">Efector</text><text x="430" y="260" font-weight="700">Sitio activo</text><path d="M455 245L490 210" stroke="#397fa6" stroke-width="4" fill="none"/><text x="830" y="485" font-weight="700">Sitio alostérico</text><path d="M825 455L800 415" stroke="#c47b45" stroke-width="4" fill="none"/><text x="550" y="565" text-anchor="middle" font-size="22" fill="#746783">El efector se une en un sitio distinto y puede modificar la actividad del sitio activo</text></g></svg>