<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Actividad enzimática en función de la temperatura</title><desc id="d">La actividad aumenta hasta una temperatura óptima y luego cae abruptamente por desnaturalización.</desc><rect width="1000" height="560" rx="24" fill="#fbfaff"/><g stroke="#594477" stroke-width="4" fill="none"><path d="M110 110V430H890"/></g><path d="M125 410 C240 390 340 315 450 175 S570 100 620 135 C665 175 680 300 720 375 S815 415 880 420" stroke="#c47b45" stroke-width="9" fill="none" stroke-linecap="round"/><g font-family="Arial" font-size="22" fill="#302445"><text x="55" y="110">Actividad</text><text x="850" y="475">Temperatura</text><text x="550" y="95" fill="#b16d37" font-weight="700">Temperatura óptima</text><path d="M610 105L590 130" stroke="#b16d37" stroke-width="3"/></g><text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="20" fill="#746783">El descenso por encima del óptimo se relaciona con desnaturalización</text></svg>