<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Actividad enzimática en función de la temperatura</title><desc id="d">La actividad aumenta progresivamente hasta un máximo y luego disminuye de manera pronunciada por desnaturalización.</desc><rect width="1000" height="560" rx="24" fill="#fbfaff"/><g stroke="#594477" stroke-width="4" fill="none"><path d="M115 105V425H890"/></g><g font-family="Arial" font-size="22" fill="#302445"><text transform="translate(48 275) rotate(-90)" text-anchor="middle">Actividad</text><text x="890" y="468" text-anchor="end">Temperatura</text></g><path d="M130 410 C250 400 330 330 420 225 C485 150 550 120 600 137 C645 152 665 205 680 275 C700 355 740 395 805 410 C840 418 865 420 885 421" stroke="#c47b45" stroke-width="9" fill="none" stroke-linecap="round"/><text x="635" y="83" font-family="Arial" font-size="22" font-weight="700" fill="#b16d37">Temperatura óptima</text><path d="M655 95L610 135" stroke="#b16d37" stroke-width="3" fill="none"/><text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="19" fill="#746783">El descenso por encima del óptimo se relaciona con desnaturalización</text></svg>