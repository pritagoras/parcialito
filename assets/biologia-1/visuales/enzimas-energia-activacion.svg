<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Perfil energético de una reacción con y sin enzima</title><desc id="d">Dos caminos de reacción comparten niveles inicial y final. El camino catalizado tiene una barrera de activación más baja.</desc><rect width="1000" height="620" rx="24" fill="#fbfaff"/><g stroke="#594477" stroke-width="4" fill="none"><path d="M115 95V455H890"/></g><g font-family="Arial" fill="#302445" font-size="22"><text transform="translate(45 275) rotate(-90)" text-anchor="middle">Energía</text><text x="500" y="525" text-anchor="middle">Progreso de la reacción</text><text x="130" y="315">Reactivos</text><text x="835" y="390" text-anchor="end">Productos</text></g><path d="M170 300 C270 300 315 100 480 100 S700 385 830 385" stroke="#c47b45" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M170 300 C285 300 340 220 480 220 S700 385 830 385" stroke="#397fa6" stroke-width="8" fill="none" stroke-linecap="round"/><g font-family="Arial" font-size="22" font-weight="700"><text x="500" y="80" fill="#b16d37">Sin enzima</text><text x="500" y="200" fill="#397fa6">Con enzima</text></g><path d="M170 300H830" stroke="#9b7bff" stroke-width="3" stroke-dasharray="8 9" opacity=".4"/><text x="500" y="580" text-anchor="middle" font-family="Arial" font-size="19" fill="#746783">Los niveles de energía de reactivos y productos no cambian</text></svg>