<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Perfil energético de una reacción con y sin enzima</title><desc id="d">Dos perfiles comparten niveles inicial y final, pero el camino catalizado presenta un pico de energía de activación más bajo.</desc><rect width="1000" height="560" rx="24" fill="#fbfaff"/><g stroke="#594477" stroke-width="4" fill="none"><path d="M110 90V430H900"/></g><g font-family="Arial" fill="#302445" font-size="23"><text x="48" y="110">Energía</text><text x="790" y="475">Progreso de reacción</text><text x="120" y="300">Reactivos</text><text x="835" y="365">Productos</text></g><path d="M150 280 C260 280 300 70 475 70 S690 355 850 355" stroke="#c47b45" stroke-width="8" fill="none"/><path d="M150 280 C270 280 325 205 475 205 S700 355 850 355" stroke="#397fa6" stroke-width="8" fill="none"/><g font-family="Arial" font-size="22" font-weight="700"><text x="470" y="55" fill="#b16d37">Sin enzima</text><text x="485" y="190" fill="#397fa6">Con enzima</text></g><path d="M150 280H850" stroke="#9b7bff" stroke-width="3" stroke-dasharray="8 9" opacity=".45"/><text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="20" fill="#746783">Esquema cualitativo: los niveles de reactivos y productos no cambian</text></svg>