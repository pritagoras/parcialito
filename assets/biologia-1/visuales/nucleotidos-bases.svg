<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">Bases nitrogenadas: anillos dobles y simples</title><desc id="d">Una estructura con dos anillos fusionados y otra con un solo anillo de seis miembros.</desc><rect width="1100" height="560" rx="24" fill="#fbfaff"/><g font-family="Arial" fill="#302445" text-anchor="middle"><text x="290" y="70" font-size="34" font-weight="700">A</text><text x="810" y="70" font-size="34" font-weight="700">B</text></g><g stroke="#594477" stroke-width="6" fill="#eee8fb"><path d="M155 225L230 180L305 225L305 315L230 360L155 315Z"/><path d="M305 225L375 180L445 225L415 315L305 315Z"/><path d="M665 225L740 180L815 225L815 315L740 360L665 315Z"/></g><g font-family="Arial" font-size="25" font-weight="700" fill="#8b4f9f" text-anchor="middle"><text x="230" y="278">N</text><text x="380" y="278">N</text><text x="740" y="278">N</text></g><g font-family="Arial" font-size="23" fill="#302445" text-anchor="middle"><text x="305" y="430">Dos anillos fusionados</text><text x="740" y="430">Un anillo</text><text x="550" y="500" font-size="20" fill="#746783">El criterio de clasificación es el número de anillos del esqueleto nitrogenado</text></g></svg>