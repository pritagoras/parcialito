<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Tres pares de anillos de monosacáridos</title><desc id="d">Tres esquemas A, B y C. En A y B dos anillos de seis miembros se conectan desde un carbono anomérico a otro carbono del segundo anillo, con distinta orientación del enlace. En C se conectan dos carbonos anoméricos de un anillo de seis y uno de cinco miembros.</desc><rect width="1200" height="520" rx="24" fill="#fbfaff"/><g font-family="Arial" font-size="34" font-weight="700" fill="#302445" text-anchor="middle"><text x="200" y="55">A</text><text x="600" y="55">B</text><text x="1000" y="55">C</text></g><g stroke="#594477" stroke-width="5" fill="#eee8fb"><path d="M155 145L215 190L215 250L155 285L95 250L95 190Z"/><path d="M315 145L375 190L375 250L315 285L255 250L255 190Z"/><path d="M555 145L615 190L615 250L555 285L495 250L495 190Z"/><path d="M715 145L775 190L775 250L715 285L655 250L655 190Z"/><path d="M955 145L1015 190L1015 250L955 285L895 250L895 190Z"/><path d="M1095 160L1155 195L1155 265L1085 280L1045 220Z"/></g><g font-family="Arial" font-size="25" font-weight="700" fill="#302445" text-anchor="middle"><text x="155" y="157">O</text><text x="315" y="157">O</text><text x="555" y="157">O</text><text x="715" y="157">O</text><text x="955" y="157">O</text><text x="1095" y="175">O</text></g><g stroke="#9b7bff" stroke-width="8" fill="none" stroke-linecap="round"><path d="M215 190L235 225L255 250"/><path d="M615 190L635 150L655 250"/><path d="M1015 190L1040 215L1045 220"/></g><g fill="#9b7bff" stroke="#6c4db0" stroke-width="2"><circle cx="235" cy="225" r="8"/><circle cx="635" cy="150" r="8"/><circle cx="1040" cy="215" r="8"/></g><g stroke="#705b91" stroke-width="4" fill="none"><path d="M155 145L155 105M555 145L555 105M955 145L955 105"/></g><g font-family="Arial" font-size="19" fill="#746783" text-anchor="middle"><text x="200" y="430"> </text><text x="600" y="430"> </text><text x="1000" y="430"> </text></g></sv