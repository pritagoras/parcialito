<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Pares complementarios de bases</title><desc id="d">Dos pares de bases nitrogenadas complementarias, representados mediante dos líneas punteadas en un par y tres en el otro.</desc><rect width="1000" height="520" rx="24" fill="#fbfaff"/><g font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#302445"><text x="270" y="65">A—T</text><text x="730" y="65">G—C</text></g><g fill="#eee8fb" stroke="#594477" stroke-width="5"><path d="M150 180L205 145L260 180L260 260L205 295L150 260Z"/><path d="M340 180L395 145L450 180L450 260L395 295L340 260Z"/><path d="M610 180L665 145L720 180L720 260L665 295L610 260Z"/><path d="M800 180L855 145L910 180L910 260L855 295L800 260Z"/></g><g font-family="Arial" font-size="27" font-weight="700" text-anchor="middle" fill="#8b4f9f"><text x="205" y="230">A</text><text x="395" y="230">T</text><text x="665" y="230">G</text><text x="855" y="230">C</text></g><g stroke="#9b7bff" stroke-width="6" stroke-dasharray="10 9"><path d="M260 205H340"/><path d="M260 245H340"/><path d="M720 195H800"/><path d="M720 225H800"/><path d="M720 255H800"/></g><text x="500" y="445" text-anchor="middle" font-family="Arial" font-size="20" fill="#746783">Las líneas punteadas representan puentes de hidrógeno</text></svg>